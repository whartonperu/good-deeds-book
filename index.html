<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>My Good Deeds Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f5e9d0;
    --parchment-dark: #ead8b1;
    --ink: #4a2c1a;
    --ink-soft: #7a5840;
    --gold: #d4a341;
    --gold-deep: #a87a1f;
    --berry: #b94a4a;
    --leaf: #6b8e3d;
    --shadow: rgba(74, 44, 26, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(212, 163, 65, 0.12), transparent 35%),
      radial-gradient(circle at 85% 70%, rgba(185, 74, 74, 0.08), transparent 35%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.29 0 0 0 0 0.17 0 0 0 0 0.10 0 0 0 0.08 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  .page {
    max-width: 540px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    position: relative;
  }

  .cover { text-align: center; padding: 12px 0 28px; position: relative; }

  .eyebrow {
    font-family: 'Patrick Hand', cursive;
    font-size: 16px;
    color: var(--ink-soft);
    transform: rotate(-2deg);
    display: inline-block;
    margin-bottom: 4px;
  }

  h1 {
    font-family: 'Caveat Brush', cursive;
    font-size: clamp(48px, 13vw, 68px);
    line-height: 0.95;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--gold), 4px 4px 0 var(--ink);
    transform: rotate(-1.5deg);
  }
  h1 .gold { color: var(--gold-deep); }

  .stamp {
    position: absolute;
    top: -6px; right: 10px;
    width: 70px; height: 70px;
    transform: rotate(12deg);
    opacity: 0.9;
  }

  .jars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 20px;
  }

  .jars-status {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    font-family: 'Patrick Hand', cursive;
    font-size: 20px;
    color: var(--ink-soft);
  }

  .jar-card {
    background: linear-gradient(180deg, #fef6e3 0%, #f7e6c2 100%);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 18px 14px 20px;
    box-shadow: 5px 5px 0 var(--ink), 0 10px 20px var(--shadow);
    position: relative;
    transform: rotate(-0.6deg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .jar-card:nth-child(even) { transform: rotate(0.6deg); }

  .jar-card::before {
    content: '';
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 2px dashed var(--ink-soft);
    border-radius: 18px;
    pointer-events: none;
    opacity: 0.35;
  }

  .jar-kid-name {
    font-family: 'Caveat Brush', cursive;
    font-size: 30px;
    color: var(--ink);
    line-height: 1;
    text-shadow: 2px 2px 0 var(--gold), 3px 3px 0 var(--ink);
    margin-bottom: 4px;
    transform: rotate(-1deg);
  }

  .jar-eyebrow {
    font-family: 'Patrick Hand', cursive;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  .jar-svg {
    width: 140px;
    height: 158px;
    filter: drop-shadow(3px 4px 0 var(--shadow));
    animation: wobble 4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .jar-card:nth-child(even) .jar-svg { animation-delay: -2s; }

  @keyframes wobble {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }

  .jar-amt {
    font-family: 'Caveat Brush', cursive;
    font-size: 42px;
    color: var(--gold-deep);
    line-height: 1;
    text-shadow: 2px 2px 0 var(--ink);
    margin-top: 4px;
    transform: rotate(-1deg);
  }

  .jar-sub {
    font-family: 'Patrick Hand', cursive;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 4px;
    text-align: center;
  }

  .section-title {
    font-family: 'Caveat Brush', cursive;
    font-size: 36px;
    margin: 36px 0 16px;
    text-align: center;
    transform: rotate(-1deg);
  }
  .section-title::before, .section-title::after {
    content: '✦';
    color: var(--gold-deep);
    margin: 0 12px;
    font-size: 22px;
    vertical-align: 6px;
  }

  .stack { display: flex; flex-direction: column; gap: 22px; }

  /* Per-child deeds block */
  .child-deeds {
    background: #fff8e8;
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 18px 18px 16px;
    box-shadow: 5px 5px 0 var(--ink);
    position: relative;
  }
  .child-deeds:nth-child(odd)  { transform: rotate(-0.5deg); }
  .child-deeds:nth-child(even) { transform: rotate(0.5deg); }

  .child-deeds-name {
    font-family: 'Caveat Brush', cursive;
    font-size: 28px;
    color: var(--ink);
    line-height: 1;
    text-shadow: 2px 2px 0 var(--gold), 3px 3px 0 var(--ink);
    margin-bottom: 14px;
    transform: rotate(-1deg);
    display: inline-block;
  }

  .deed-group {
    margin-top: 10px;
  }
  .deed-group + .deed-group {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1.5px dashed var(--rule);
  }

  .deed-group-heading {
    font-family: 'Caveat Brush', cursive;
    font-size: 18px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .deed-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 14px;
    border: 1.5px solid var(--ink);
    background: #fff;
  }
  .deed-group.positive .deed-badge { background: #e8f0d8; }
  .deed-group.negative .deed-badge { background: #f4d8d0; }

  .deed-entry {
    background: #fef6e3;
    border: 1.5px solid var(--ink);
    border-left-width: 5px;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .deed-entry.positive { border-left-color: var(--leaf); }
  .deed-entry.negative { border-left-color: var(--berry); }
  .deed-entry:last-child { margin-bottom: 0; }

  .deed-when { flex: 1; min-width: 0; }

  .deed-date {
    font-family: 'Patrick Hand', cursive;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .deed-desc {
    font-family: 'Patrick Hand', cursive;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.3;
    margin-top: 1px;
    word-wrap: break-word;
  }

  .deed-amt {
    font-family: 'Caveat Brush', cursive;
    font-size: 22px;
    flex-shrink: 0;
    text-shadow: 1.5px 1.5px 0 var(--ink);
  }
  .deed-entry.positive .deed-amt { color: var(--leaf); }
  .deed-entry.negative .deed-amt { color: var(--berry); }

  .deed-empty {
    font-family: 'Patrick Hand', cursive;
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 6px 12px;
    opacity: 0.75;
  }

  .status {
    text-align: center;
    padding: 40px 20px;
    font-family: 'Patrick Hand', cursive;
    font-size: 20px;
    color: var(--ink-soft);
  }
  .status.error {
    color: var(--berry);
    background: #fff8e8;
    border: 2.5px dashed var(--berry);
    border-radius: 22px;
    margin: 16px 0;
  }

  .footer-hand {
    text-align: center;
    margin-top: 36px;
    font-family: 'Patrick Hand', cursive;
    font-size: 16px;
    color: var(--ink-soft);
  }

  .reload-btn {
    display: inline-block;
    background: var(--berry);
    color: #fff8e8;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 10px 22px;
    font-family: 'Caveat Brush', cursive;
    font-size: 22px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    margin-top: 14px;
    transition: transform 0.1s;
  }
  .reload-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  .confetti { position: fixed; pointer-events: none; inset: 0; overflow: hidden; z-index: 100; }
  .coin-fall {
    position: absolute;
    width: 22px; height: 22px;
    background: radial-gradient(circle at 35% 30%, #ffe89a, var(--gold) 50%, var(--gold-deep));
    border-radius: 50%;
    border: 2px solid var(--ink);
    animation: fall 1.6s cubic-bezier(.4,.1,.7,1) forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-40px) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.7; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(12px);
    animation: rise 0.5s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .coins-stack circle {
    transform-origin: center;
    animation: pop 0.5s cubic-bezier(.4,1.6,.5,1) backwards;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 380px) {
    body { font-size: 16px; }
    h1 { font-size: 44px; }
    .jar-amt { font-size: 36px; }
    .jar-kid-name { font-size: 26px; }
    .child-deeds-name { font-size: 24px; }
    .deed-amt { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="cover">
    <span class="eyebrow">~ Chapter One ~</span>
    <h1>My <span class="gold">Good Deeds</span><br>Book</h1>
    <svg class="stamp" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#b94a4a" stroke-width="3" stroke-dasharray="3 4" opacity="0.85"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="#b94a4a" stroke-width="2" opacity="0.85"/>
      <text x="50" y="46" text-anchor="middle" font-family="Caveat Brush, cursive" font-size="14" fill="#b94a4a">SUPER</text>
      <text x="50" y="62" text-anchor="middle" font-family="Caveat Brush, cursive" font-size="14" fill="#b94a4a">HELPER</text>
    </svg>
  </header>

  <section id="jarsContainer" class="jars-grid">
    <!-- Jars are rendered dynamically, one per kid -->
    <div class="jars-status" id="jarsStatus">📖 Opening the book…</div>
  </section>

  <h2 class="section-title">Last few deeds</h2>
  <div class="stack" id="deedsStack">
    <div class="status" id="statusBox">📖 Opening the book…</div>
  </div>

  <div class="footer-hand">
    <div id="updatedAt">&nbsp;</div>
    <button class="reload-btn" id="reloadBtn">↻ Read again!</button>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
  // ========================================================================
  // CONFIG — fill these in
  // ========================================================================
  // 1) Sheet must be shared as "Anyone with the link can view"
  //    (File → Share → General access → Anyone with the link)
  // 2) SHEET_ID is in the sheet URL:
  //    https://docs.google.com/spreadsheets/d/[SHEET_ID]/edit#gid=[GID]
  // 3) Set SHEET_NAME to the tab where the pivot table is.
  //    Or set SHEET_GID instead — useful when the tab name has spaces.
  //
  // The page calls Google's GViz JSON endpoint live every time it loads.
  // No file is downloaded by the user.
  // ========================================================================
  const SHEET_ID   = '1_xlDI2q-_66dnqiFoZyvUIuCxbXtxPB0u1h9fBDYxKA';
  const SHEET_NAME = 'Pivot Table 1';   // tab name
  const SHEET_GID  = 34893663;   // OR a gid number, e.g. 123456789. Use null to ignore.

  // Source data tab (form responses) — used for the per-child deeds list
  const RESPONSES_NAME = 'Form Responses 1';
  const RESPONSES_GID  = null;   // optional override

  // Optional column overrides. Use the column header text or column letter.
  // Leave null to auto-detect (first text column = label, last numeric = amount).
  const LABEL_COL_OVERRIDE  = null;
  const AMOUNT_COL_OVERRIDE = null;

  const CURRENCY = 'S/';
  // ========================================================================

  const ICONS = {
    allowance:'💵', chore:'🧹', chores:'🧹', gift:'🎁', birthday:'🎂',
    bonus:'⭐', tooth:'🦷', toothfairy:'🦷', save:'🐷', saving:'🐷',
    savings:'🐷', spend:'🛍️', spending:'🛍️', toy:'🧸', toys:'🧸',
    book:'📚', books:'📚', candy:'🍭', sweet:'🍭', sweets:'🍭',
    food:'🍎', game:'🎮', games:'🎮', icecream:'🍦', 'ice cream':'🍦',
    sticker:'🌟', stickers:'🌟', help:'🤝', helping:'🤝',
    grandma:'👵', grandpa:'👴', mom:'👩', dad:'👨', auntie:'🌷',
    uncle:'🎩', dog:'🐶', cat:'🐱', plant:'🌱', water:'💧',
    clean:'🧼', dish:'🍽️', dishes:'🍽️', laundry:'🧺', bed:'🛏️',
    work:'🛠️', job:'🛠️', total:'✨',
    january:'❄️', february:'💝', march:'🌷', april:'🌧️', may:'🌸',
    june:'☀️', july:'🎆', august:'🍉', september:'🍂', october:'🎃',
    november:'🦃', december:'🎄'
  };

  function pickIcon(label) {
    const key = String(label || '').toLowerCase().trim();
    if (ICONS[key]) return ICONS[key];
    for (const word of key.split(/\s+/)) if (ICONS[word]) return ICONS[word];
    const fallbacks = ['🌟','🍀','🌈','🎈','🎀','🪙','💝','🌻','🦋','🌸','🧁','🌷'];
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return fallbacks[h % fallbacks.length];
  }

  function formatMoney(n) {
    if (!isFinite(n)) return CURRENCY + '?';
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(n);
    return sign + CURRENCY + abs.toFixed(2).replace(/\.00$/, '');
  }

  function looksLikeTotal(label) {
    return /^(grand\s*)?total\b/i.test(String(label || '').trim());
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const deedsStack = document.getElementById('deedsStack');
  const jarsContainer = document.getElementById('jarsContainer');
  const jarsStatus = document.getElementById('jarsStatus');
  const updatedAt = document.getElementById('updatedAt');
  const reloadBtn = document.getElementById('reloadBtn');

  function showStatus(html, isError) {
    deedsStack.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'status' + (isError ? ' error' : '');
    div.innerHTML = html;
    deedsStack.appendChild(div);
  }

  function renderJarCoins(coinsGroup, fillRatio) {
    const ratio = Math.max(0, Math.min(1, fillRatio));
    coinsGroup.innerHTML = '';
    const xMin = 50, xMax = 150;
    const yBottom = 204, yTop = 50;
    const fillH = (yBottom - yTop) * ratio;
    const fillTopY = yBottom - fillH;
    if (ratio <= 0) return;
    const colors = ['#d4a341', '#e8b94a', '#a87a1f', '#c89236'];
    let y = yBottom - 8, rowIdx = 0, i = 0;
    while (y > fillTopY + 4) {
      const offset = (rowIdx % 2) * 7;
      for (let x = xMin + 4 + offset; x < xMax - 4; x += 14) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        el.setAttribute('cx', x);
        el.setAttribute('cy', y);
        el.setAttribute('r', 6);
        el.setAttribute('fill', colors[(rowIdx + Math.floor(x)) % colors.length]);
        el.setAttribute('stroke', '#4a2c1a');
        el.setAttribute('stroke-width', '1.2');
        el.style.animationDelay = (i++ * 0.012) + 's';
        coinsGroup.appendChild(el);
      }
      y -= 10;
      rowIdx++;
    }
  }

  function showCoinShower() {
    const c = document.getElementById('confetti');
    c.innerHTML = '';
    for (let i = 0; i < 18; i++) {
      const coin = document.createElement('div');
      coin.className = 'coin-fall';
      coin.style.left = (Math.random() * 100) + '%';
      coin.style.animationDelay = (Math.random() * 0.6) + 's';
      coin.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
      c.appendChild(coin);
    }
    setTimeout(() => { c.innerHTML = ''; }, 2800);
  }

  function animateNumber(el, target) {
    const duration = 900;
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const v = target * eased;
      el.textContent = CURRENCY + v.toFixed(2).replace(/\.00$/, '');
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = formatMoney(target);
    }
    requestAnimationFrame(tick);
  }

  // ----- Render one jar per kid -----
  // Fill height uses a shared cap so jars are comparable across kids.
  function renderJars(items) {
    jarsContainer.innerHTML = '';
    if (items.length === 0) return;

    // Shared fill cap keeps the two jars visually comparable.
    const maxAmount = Math.max(...items.map(it => it.amount), 0);
    const fillCap = Math.max(maxAmount, 30);

    items.forEach((it, i) => {
      const card = document.createElement('section');
      card.className = 'jar-card reveal';
      card.dataset.person = it.label;
      card.style.animationDelay = (0.05 + i * 0.1) + 's';

      // Rotate the jar label a touch differently per card so they don't look pasted
      const nameRot = (i % 2 === 0 ? -1.4 : 1.4);

      card.innerHTML = `
        <div class="jar-eyebrow">${escapeHtml(pickIcon(it.label))} good deeds jar</div>
        <div class="jar-kid-name" style="transform:rotate(${nameRot}deg)">${escapeHtml(it.label)}</div>
        <svg class="jar-svg" viewBox="0 0 200 220" aria-label="${escapeHtml(it.label)}'s jar">
          <rect x="48" y="14" width="104" height="22" rx="6" fill="#b88a4a" stroke="#4a2c1a" stroke-width="3"/>
          <rect x="52" y="18" width="96" height="6" rx="2" fill="#d4a341" opacity="0.7"/>
          <path d="M 40 40 Q 40 36 44 36 L 156 36 Q 160 36 160 40 L 160 200 Q 160 210 150 210 L 50 210 Q 40 210 40 200 Z"
                fill="rgba(255,250,235,0.6)" stroke="#4a2c1a" stroke-width="3.5"/>
          <path d="M 56 50 L 56 180" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
          <path d="M 70 60 L 70 100" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
          <rect x="86" y="18" width="28" height="4" rx="1" fill="#4a2c1a" opacity="0.6"/>
          <g class="coins-stack"></g>
          <g transform="translate(100 188) rotate(-3)">
            <rect x="-42" y="-10" width="84" height="20" rx="3" fill="#fff8e8" stroke="#4a2c1a" stroke-width="2"/>
            <text x="0" y="5" text-anchor="middle" font-family="Caveat Brush, cursive" font-size="14" fill="#4a2c1a">${escapeHtml(it.label.toUpperCase())}</text>
          </g>
        </svg>
        <div class="jar-amt" data-target-amount="${it.amount}">${formatMoney(0)}</div>
        <div class="jar-sub">so far!</div>
      `;
      jarsContainer.appendChild(card);

      // Animate the amount readout and fill the coins
      const amtEl = card.querySelector('.jar-amt');
      animateNumber(amtEl, it.amount);
      const coinsGroup = card.querySelector('.coins-stack');
      // Ratio uses shared cap so jars are comparable
      renderJarCoins(coinsGroup, Math.max(0, it.amount) / fillCap);
    });
  }

  function render(items, total) {
    if (items.length === 0) {
      // Pivot returned nothing usable — maybe #VALUE! on every row.
      // Show a placeholder; the loadResponses fetch may still populate jars from raw data.
      jarsContainer.innerHTML = '<div class="jars-status">📖 Reading the ledger…</div>';
      showStatus('📖 Turning the pages…');
      return;
    }

    // JARS: one per kid, at the top
    renderJars(items);

    // Deeds section — placeholder until form responses load
    showStatus('📖 Turning the pages…');

    showCoinShower();
  }

  // GViz returns text like "/*O_o*/\ngoogle.visualization.Query.setResponse({...});"

  // ----- Parse a soles amount out of strings like "Small 1s/", "Medium 2s/", "Large -5s/", "Medium - 2s/" -----
  // Also handles free-text "Other" entries: bare numbers ("3", "-2"), "Other 3s/", "3 soles", "S/3", etc.
  // Returns { value, ok } — value is a number (or NaN), ok indicates a successful parse.
  function parseSoles(label) {
    if (label == null) return NaN;
    const s = String(label).trim();
    if (!s) return NaN;

    // Pattern 1: the standard "... 1s/" / "... -5s/" / "... - 2s/" form
    let m = s.match(/(-?\s*\d+(?:\.\d+)?)\s*s\s*\//i);
    if (m) return parseFloat(m[1].replace(/\s+/g, ''));

    // Pattern 2: "S/3", "S/.3", "S/ 3", "S/-3"
    m = s.match(/s\/\.?\s*(-?\s*\d+(?:\.\d+)?)/i);
    if (m) return parseFloat(m[1].replace(/\s+/g, ''));

    // Pattern 3: number followed by "soles" or "sol"
    m = s.match(/(-?\s*\d+(?:\.\d+)?)\s*sol/i);
    if (m) return parseFloat(m[1].replace(/\s+/g, ''));

    // Pattern 4: label like "Other: 3" or "Other - 3" — pick the first number
    m = s.match(/other[^\d\-]*(-?\s*\d+(?:\.\d+)?)/i);
    if (m) return parseFloat(m[1].replace(/\s+/g, ''));

    // Pattern 5: bare number ("3", "-2", "3.5")
    m = s.match(/^\s*(-?\s*\d+(?:\.\d+)?)\s*$/);
    if (m) return parseFloat(m[1].replace(/\s+/g, ''));

    // Pattern 6: last-resort — any signed number anywhere in the string
    m = s.match(/(-?\d+(?:\.\d+)?)/);
    if (m) return parseFloat(m[1]);

    return NaN;
  }

  // ----- Build per-person cumulative time series from raw form responses -----
  // rows: array of GViz row objects from "Form Responses 1"
  // cols: array of GViz column descriptors
  // Returns: Map<personName, Array<{date: Date, cumulative: number, delta: number}>>
  function buildSeriesByPerson(cols, rows) {
    // Find column indices by header label
    function findCol(labelMatcher) {
      for (let i = 0; i < cols.length; i++) {
        const lbl = (cols[i].label || cols[i].id || '').toLowerCase();
        if (labelMatcher(lbl)) return i;
      }
      return -1;
    }
    const tsIdx     = findCol(l => l.includes('timestamp') || l.includes('date'));
    const whoIdx    = findCol(l => l === 'who' || l.includes('who') || l.includes('name'));
    const amountIdx = findCol(l => l.includes('deed') || l.includes('amount') || l.includes('size'));
    const descIdx   = findCol(l => l.includes('what') || l.includes('desc') || l.includes('note'));

    if (tsIdx < 0 || whoIdx < 0 || amountIdx < 0) {
      console.warn('Missing expected columns in Form Responses:', { tsIdx, whoIdx, amountIdx });
      return { seriesByPerson: new Map(), entries: [], warnings: [] };
    }

    const entries = [];
    const warnings = [];

    for (let rowIdx = 0; rowIdx < rows.length; rowIdx++) {
      const r = rows[rowIdx];
      if (!r.c) continue;
      const tsCell = r.c[tsIdx];
      const whoCell = r.c[whoIdx];
      const amtCell = r.c[amountIdx];
      const descCell = descIdx >= 0 ? r.c[descIdx] : null;
      if (!tsCell || !whoCell || !amtCell) continue;

      // Parse timestamp
      let dt = null;
      const tsv = tsCell.v;
      if (tsv instanceof Date) dt = tsv;
      else if (typeof tsv === 'string') {
        const m = tsv.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
        if (m) {
          dt = new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
        } else {
          const parsed = new Date(tsv);
          if (!isNaN(parsed.getTime())) dt = parsed;
        }
      } else if (typeof tsv === 'number') {
        dt = new Date(tsv);
      }
      if (!dt || isNaN(dt.getTime())) continue;

      const who = String(whoCell.f ?? whoCell.v ?? '').trim();
      if (!who) continue;

      const amtRaw = amtCell.f ?? amtCell.v;
      const delta = parseSoles(amtRaw);
      const description = descCell ? String(descCell.f ?? descCell.v ?? '').trim() : '';

      if (isNaN(delta)) {
        warnings.push({ rowNumber: rowIdx + 2, who, rawAmount: String(amtRaw ?? ''), description });
        continue;
      }

      entries.push({ date: dt, who, delta, rawAmount: String(amtRaw ?? ''), description });
    }

    // Sort by date and build per-person cumulative
    entries.sort((a, b) => a.date - b.date);
    const seriesByPerson = new Map();
    for (const e of entries) {
      const prev = seriesByPerson.get(e.who) || [];
      const last = prev.length ? prev[prev.length - 1].cumulative : 0;
      prev.push({ date: e.date, delta: e.delta, cumulative: last + e.delta });
      seriesByPerson.set(e.who, prev);
    }
    return { seriesByPerson, entries, warnings };
  }

  // -------------------------------------------------------------------------

  // GViz JSONP-wrapped response parser
  function parseGViz(text) {
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('Unexpected response from sheet');
    return JSON.parse(text.slice(start, end + 1));
  }

  function chooseColumns(cols, rows) {
    const stats = cols.map((c, ci) => {
      let numeric = 0, nonEmpty = 0;
      for (const r of rows) {
        const cell = r.c && r.c[ci];
        if (!cell || cell.v == null || cell.v === '') continue;
        nonEmpty++;
        if (typeof cell.v === 'number') numeric++;
      }
      return { ci, label: c.label || c.id, type: c.type, numeric, nonEmpty,
               ratio: nonEmpty ? numeric / nonEmpty : 0 };
    });

    function findCol(spec) {
      if (spec == null) return -1;
      const s = String(spec).toLowerCase();
      const found = stats.find(c =>
        (c.label || '').toLowerCase() === s ||
        (cols[c.ci].id || '').toLowerCase() === s
      );
      return found ? found.ci : -1;
    }
    let labelIdx = findCol(LABEL_COL_OVERRIDE);
    let amountIdx = findCol(AMOUNT_COL_OVERRIDE);

    if (labelIdx < 0) {
      const cand = stats.find(c => c.type === 'string') ||
                   stats.find(c => c.nonEmpty > 0 && c.ratio < 0.5) ||
                   stats[0];
      labelIdx = cand.ci;
    }
    if (amountIdx < 0) {
      const numericCols = stats.filter(c =>
        c.ci !== labelIdx && (c.type === 'number' || c.ratio >= 0.5) && c.nonEmpty > 0
      );
      const cand = numericCols[numericCols.length - 1] || stats[stats.length - 1];
      amountIdx = cand.ci;
    }
    return { labelIdx, amountIdx };
  }

  // ----- Reconcile pivot totals with the numbers we calculated from raw responses -----
  // The pivot can return "#VALUE!" if any "Other" write-in isn't parseable by its
  // formula. We recompute totals from raw entries and update cards/hero accordingly.
  function reconcileTotals(totalsFromResponses) {
    if (totalsFromResponses.size === 0) return;

    let anyMismatch = false;

    // Helper: case-insensitive lookup into the totals map
    function lookupTotal(name) {
      if (totalsFromResponses.has(name)) return totalsFromResponses.get(name);
      for (const [k, v] of totalsFromResponses) {
        if (k.toLowerCase() === name.toLowerCase()) return v;
      }
      return null;
    }

    // Update each jar card and track which people have been reconciled.
    // Recompute the fill cap from reconciled totals so jars stay comparable.
    const seenPeople = new Set();
    const reconciledAmounts = [];
    document.querySelectorAll('.jar-card[data-person]').forEach(jar => {
      const person = jar.dataset.person;
      const recomputed = lookupTotal(person);
      if (recomputed == null) return;
      seenPeople.add(person.toLowerCase());
      reconciledAmounts.push(recomputed);
    });
    const maxReconciled = Math.max(...reconciledAmounts, 0);
    const fillCap = Math.max(maxReconciled, 30);

    document.querySelectorAll('.jar-card[data-person]').forEach(jar => {
      const person = jar.dataset.person;
      const recomputed = lookupTotal(person);
      if (recomputed == null) return;

      const amtEl = jar.querySelector('.jar-amt');
      if (amtEl) {
        const currentText = amtEl.textContent;
        const newText = formatMoney(recomputed);
        if (currentText !== newText) {
          anyMismatch = true;
          animateNumber(amtEl, recomputed);
        }
      }
      const coinsGroup = jar.querySelector('.coins-stack');
      if (coinsGroup) {
        renderJarCoins(coinsGroup, Math.max(0, recomputed) / fillCap);
      }
    });

    // Note people who appear in responses but not in the pivot (would need a jar)
    let missingFromPivot = [];
    for (const [person, amount] of totalsFromResponses) {
      if (!seenPeople.has(person.toLowerCase())) {
        missingFromPivot.push({ label: person, amount });
      }
    }

    if (missingFromPivot.length > 0) {
      console.info('These people are in Form Responses but the pivot is missing them (likely #VALUE! error) — re-rendering jars from raw totals:', missingFromPivot.map(p => p.label).join(', '));
      // Rebuild the full jar list from reconciled totals
      const fullItems = [];
      // Preserve pivot ordering for kids already there
      document.querySelectorAll('.jar-card[data-person]').forEach(jar => {
        const person = jar.dataset.person;
        const recomputed = lookupTotal(person);
        if (recomputed != null) fullItems.push({ label: person, amount: recomputed });
      });
      // Append missing ones
      fullItems.push(...missingFromPivot);
      renderJars(fullItems);
      anyMismatch = true;
    }

    if (anyMismatch) {
      console.info('Pivot totals reconciled from raw form responses (pivot may show #VALUE! for Other write-ins).');
    }
  }

  // ----- Render the last 2 positive and last 2 negative deeds PER CHILD -----
  function renderPerChildDeeds(entries) {
    deedsStack.innerHTML = '';
    if (!entries || entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'status';
      empty.textContent = '🪺 No deeds yet — go do something kind!';
      deedsStack.appendChild(empty);
      return;
    }

    // Entries arrive sorted ascending by date. Group by child (case-insensitive).
    const byChild = new Map();  // lowercaseKey -> { displayName, entries[] }
    for (const e of entries) {
      const key = e.who.toLowerCase();
      if (!byChild.has(key)) byChild.set(key, { displayName: e.who, entries: [] });
      byChild.get(key).entries.push(e);
    }

    // Determine child display order — match the jars if possible (stable, familiar)
    const jarOrder = Array.from(document.querySelectorAll('.jar-card[data-person]'))
      .map(j => j.dataset.person.toLowerCase());
    const orderedKeys = [
      ...jarOrder.filter(k => byChild.has(k)),
      ...Array.from(byChild.keys()).filter(k => !jarOrder.includes(k))
    ];

    function fmtDate(d) {
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function entryHtml(e, kind) {
      return `
        <div class="deed-entry ${kind}">
          <div class="deed-when">
            <div class="deed-date">${escapeHtml(fmtDate(e.date))}</div>
            <div class="deed-desc">${escapeHtml(e.description || '(no description)')}</div>
          </div>
          <div class="deed-amt">${e.delta > 0 ? '+' : ''}${formatMoney(e.delta)}</div>
        </div>
      `;
    }

    orderedKeys.forEach((key, idx) => {
      const { displayName, entries: childEntries } = byChild.get(key);
      const positives = childEntries.filter(e => e.delta > 0).slice(-2).reverse();
      const negatives = childEntries.filter(e => e.delta < 0).slice(-2).reverse();

      const block = document.createElement('div');
      block.className = 'child-deeds reveal';
      block.style.animationDelay = (0.05 + idx * 0.1) + 's';
      block.innerHTML = `
        <div class="child-deeds-name">${escapeHtml(displayName)}</div>
        <div class="deed-group positive">
          <div class="deed-group-heading">
            <span class="deed-badge">⭐</span>
            <span>Recent good deeds</span>
          </div>
          ${positives.length
            ? positives.map(e => entryHtml(e, 'positive')).join('')
            : '<div class="deed-empty">No good deeds yet — coming soon!</div>'}
        </div>
        <div class="deed-group negative">
          <div class="deed-group-heading">
            <span class="deed-badge">💭</span>
            <span>Recent oopsies</span>
          </div>
          ${negatives.length
            ? negatives.map(e => entryHtml(e, 'negative')).join('')
            : '<div class="deed-empty">No oopsies — keep it up! 🌟</div>'}
        </div>
      `;
      deedsStack.appendChild(block);
    });
  }

  async function loadResponses() {
    const params = new URLSearchParams();
    params.set('tqx', 'out:json');
    if (RESPONSES_GID != null) params.set('gid', String(RESPONSES_GID));
    else params.set('sheet', RESPONSES_NAME);
    params.set('_', String(Date.now()));
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' from responses tab');
    const text = await res.text();
    if (text.trim().startsWith('<')) throw new Error('responses tab not accessible');
    const data = parseGViz(text);
    if (data.status === 'error') {
      const msg = (data.errors && data.errors[0] && (data.errors[0].detailed_message || data.errors[0].message)) || 'responses tab returned an error';
      throw new Error(msg);
    }
    const { seriesByPerson, entries, warnings } = buildSeriesByPerson(data.table.cols, data.table.rows || []);

    // Warn about any rows we couldn't parse — usually free-text "Other" without a number
    if (warnings.length) {
      console.warn(`Skipped ${warnings.length} row(s) with unparseable amounts:`);
      warnings.forEach(w => console.warn(`  Row ${w.rowNumber} (${w.who}): "${w.rawAmount}" — ${w.description || '(no description)'}`));
    }

    // Reconcile jar totals from raw entries (handles broken #VALUE! pivot)
    const totalsFromResponses = new Map();
    for (const e of entries) {
      totalsFromResponses.set(e.who, (totalsFromResponses.get(e.who) || 0) + e.delta);
    }
    reconcileTotals(totalsFromResponses);

    renderPerChildDeeds(entries);
  }

  async function load() {
    if (!SHEET_ID || SHEET_ID.startsWith('PASTE_')) {
      showStatus(
        '✏️ Set <strong>SHEET_ID</strong> at the top of this file<br>' +
        'and make the sheet "Anyone with the link can view".',
        true
      );
      jarsContainer.innerHTML = '<div class="jars-status">no sheet connected yet</div>';
      return;
    }

    showStatus('📖 Opening the book…');
    jarsContainer.innerHTML = '<div class="jars-status">📖 Counting up the coins…</div>';

    const params = new URLSearchParams();
    params.set('tqx', 'out:json');
    if (SHEET_GID != null) params.set('gid', String(SHEET_GID));
    else if (SHEET_NAME) params.set('sheet', SHEET_NAME);
    params.set('_', String(Date.now())); // bust cache
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params}`;

    try {
      const res = await fetch(url);
      if (!res.ok) {
        if (res.status === 404) throw new Error("Sheet not found. Check the SHEET_ID is correct.");
        if (res.status === 401 || res.status === 403) {
          throw new Error("The sheet isn't shared publicly. Go to File → Share → General access → 'Anyone with the link → Viewer'.");
        }
        throw new Error('HTTP ' + res.status + ' from Google Sheets');
      }
      const text = await res.text();

      // If Google returned an HTML login/error page instead of JSONP, that means
      // the sheet isn't publicly accessible — surface that clearly.
      if (text.trim().startsWith('<') || text.includes('<HTML>') || text.includes('<html>')) {
        throw new Error("The sheet isn't shared publicly. Go to File → Share → General access → 'Anyone with the link → Viewer'.");
      }

      let data;
      try {
        data = parseGViz(text);
      } catch (e) {
        console.error('Raw response from Google:', text.slice(0, 500));
        throw new Error("Couldn't read the sheet's response. Check the browser console (F12) to see what came back.");
      }

      if (data.status === 'error') {
        const msg = (data.errors && data.errors[0] && (data.errors[0].detailed_message || data.errors[0].message)) || 'sheet returned an error';
        throw new Error(msg);
      }

      const cols = data.table.cols;
      const rows = data.table.rows || [];
      if (rows.length === 0) throw new Error('The book is empty.');

      const { labelIdx, amountIdx } = chooseColumns(cols, rows);

      const items = [];
      let total = 0;
      let totalFromSheet = null;

      for (const r of rows) {
        const labelCell = r.c && r.c[labelIdx];
        const amountCell = r.c && r.c[amountIdx];
        const label = labelCell ? String(labelCell.f ?? labelCell.v ?? '').trim() : '';
        const amount = amountCell && typeof amountCell.v === 'number' ? amountCell.v : NaN;
        if (!label) continue;
        if (looksLikeTotal(label)) {
          if (!isNaN(amount)) totalFromSheet = amount;
          continue;
        }
        if (isNaN(amount)) continue;
        let meta = '';
        for (let ci = 0; ci < cols.length; ci++) {
          if (ci === labelIdx || ci === amountIdx) continue;
          const cell = r.c && r.c[ci];
          if (cell && cell.v != null && cell.v !== '') {
            meta = `${cols[ci].label || cols[ci].id}: ${cell.f ?? cell.v}`;
            break;
          }
        }
        items.push({ label, amount, meta });
        total += amount;
      }

      const finalTotal = (totalFromSheet != null) ? totalFromSheet : total;
      render(items, finalTotal);

      const now = new Date();
      updatedAt.textContent = `Read on ${now.toLocaleDateString()} at ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;

      // Fire-and-forget: pull the raw form responses for the per-child deeds list.
      // Failures here don't break the main view.
      loadResponses().catch(err => {
        console.warn('Form Responses data unavailable — deeds section will be empty:', err);
        showStatus('📖 (Could not load recent deeds — check Form Responses tab is shared)');
      });
    } catch (err) {
      showStatus(
        '😢 Oh no — ' + escapeHtml(err.message) + '<br><br>' +
        '<small style="opacity:0.7">Open the browser console (F12) for more details.</small>',
        true
      );
      console.error('Failed to load sheet:', err);
      console.error('Tried URL:', url);
      jarsContainer.innerHTML = '<div class="jars-status">😢 Could not load the jars</div>';
    }
  }

  reloadBtn.addEventListener('click', load);
  load();
</script>
</body>
